name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install builder
        run: pip install -r requirements-build.txt
      - name: Make EXE
        shell: pwsh
        run: |
          # Get-Command returns Chocolatey's tiny redirector from its bin
          # directory.  It cannot work once packed into a one-file EXE.
          # Bundle the real static FFmpeg executables instead.
          $ffmpeg = (Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw "Real FFmpeg binaries were not found" }
          pyinstaller --noconsole --onefile --name AmbientVideoBuilder --add-binary "$ffmpeg;." --add-binary "$ffprobe;." ambient_video_builder_gui.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: AmbientVideoBuilder-Windows
          path: dist/AmbientVideoBuilder.exe
